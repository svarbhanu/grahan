# Tokenless npm publishing via OIDC trusted publishing.
#
# Real publishes run only on v* tags. A workflow_dispatch run is always a
# dry-run rehearsal: full pipeline, pack, inspection, `npm publish --dry-run`.
#
# npm side (one-time, per package, on npmjs.com): Settings → Trusted
# Publisher → GitHub Actions → svarbhanu / grahan / release.yml.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No registry-url here, deliberately: setup-node's registry-url
      # writes an .npmrc _authToken=${NODE_AUTH_TOKEN} placeholder that
      # npm uses INSTEAD of attempting the OIDC exchange (masked E404).
      # npmjs.org is npm's default registry; OIDC needs nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # No dependency caching in release builds.
      - name: Ensure npm supports trusted publishing (needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      - name: Pack publishable tarballs (pnpm applies publishConfig + workspace versions)
        run: |
          mkdir -p tarballs
          pnpm --filter @grahan/core exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter @grahan/calendars exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"
          pnpm --filter @grahan/vedic exec pnpm pack --pack-destination "$GITHUB_WORKSPACE/tarballs"

      - name: Inspect tarballs (dist-only, exports rewritten, version = tag)
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export EXPECT_VERSION="${GITHUB_REF_NAME#v}"
          fi
          node scripts/inspect-tarball.mjs tarballs/*.tgz

      - name: Preflight - every package must pass the OIDC exchange before any publishes
        run: |
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm%3Aregistry.npmjs.org" | jq -r .value)
          failed=0
          for pkg in @grahan/core @grahan/calendars @grahan/vedic; do
            enc=$(jq -rn --arg p "$pkg" '$p|@uri')
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $oidc" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$enc")
            echo "$pkg: exchange HTTP $code"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then failed=1; fi
          done
          if [ "$failed" = "1" ]; then
            echo "::error::A package is missing its npm Trusted Publisher config - refusing to publish a partial release."
            exit 1
          fi

      - name: Publish (dependency order; dry-run unless a v* tag triggered this)
        env:
          NPM_CONFIG_LOGLEVEL: verbose # surfaces the OIDC exchange result
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            FLAGS="--access public"
          else
            FLAGS="--access public --dry-run"
            echo "workflow_dispatch run: rehearsal only (--dry-run)"
          fi
          # The ./ prefix is load-bearing: a bare a/b.tgz is parsed by
          # npm as a github:a/b shorthand, not a file path.
          npm publish $FLAGS ./tarballs/grahan-core-*.tgz
          npm publish $FLAGS ./tarballs/grahan-calendars-*.tgz
          npm publish $FLAGS ./tarballs/grahan-vedic-*.tgz
